<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c8cff"/>
      <stop offset="100%" style="stop-color:#4f7cff"/>
    </linearGradient>
    <linearGradient id="pi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Stylized π symbol -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="320" fill="url(#pi)">π</text>
  <!-- Subtle cursor/terminal accent -->
  <rect x="340" y="380" width="60" height="8" rx="4" fill="#a8c7ff" opacity="0.85"/>
</svg>
